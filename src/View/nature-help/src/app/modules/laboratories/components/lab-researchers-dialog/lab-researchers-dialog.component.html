<h2 mat-dialog-title>{{ "tableHeaders.researchers" | translate }}</h2>

<mat-dialog-content class="dialog-content">
  <p class="dialog-subtitle">{{ data.researchers.length }} {{ "userManagement.total" | translate }}</p>

  <div
    *ngIf="data.researchers.length; else noResearchers"
    class="researchers-list">
    <label
      *ngFor="let researcher of data.researchers"
      class="researcher-row">
      <mat-checkbox
        [checked]="isSelected(researcher.id)"
        (change)="toggleResearcher(researcher.id, $event.checked)">
        {{ researcher.firstName }} {{ researcher.lastName }}
      </mat-checkbox>
      <span class="researcher-meta">
        {{ researcher.email }}
        <span *ngIf="researcher.laboratories?.length">
          ·
          {{ getLaboratoriesText(researcher) }}
        </span>
      </span>
    </label>
  </div>

  <ng-template #noResearchers>
    <div class="empty-state">No researchers found</div>
  </ng-template>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-button
    type="button"
    (click)="cancel()">
    {{ "forms.cancelBtn" | translate }}
  </button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()">
    {{ "forms.submitBtn" | translate }}
  </button>
</mat-dialog-actions>
