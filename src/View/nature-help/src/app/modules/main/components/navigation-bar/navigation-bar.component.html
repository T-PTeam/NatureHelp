<nav class="navbar">
  <div class="navbar-left">
    <button
      routerLink="water"
      [class.active]="isDeficienciesRouteActive() | async">
      {{ "navigation.deficiencies" | translate }}
    </button>
    <button
      routerLink="labs"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }">
      {{ "navigation.laboratories" | translate }}
    </button>
    <!-- <button
      routerLink="researches"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }">
      Researches
    </button> -->
    <button
      routerLink="owner"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      *ngIf="userService.isOwner$ | async">
      {{ "navigation.userManagement" | translate }}
    </button>
    <button
      routerLink="organizations"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      *ngIf="userService.isSuperAdmin$ | async">
      {{ "navigation.organizations" | translate }}
    </button>
    <button
      routerLink="about"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }">
      {{ "navigation.aboutUs" | translate }}
    </button>
  </div>

  <div class="navbar-center">
    <img
      src="assets/images/main-logo-text.png"
      alt="NatureHelp"
      class="main-logo" />
  </div>

  <div class="navbar-right">
    <button
      *ngIf="isMobile"
      data-cy="map-switch-mobile"
      mat-button
      (click)="mobileMapService.toggleMobileMap()">
      <mat-icon class="icon-medium">map</mat-icon>
    </button>

    <nat-map
      *ngIf="isMobile"
      class="mobile-map-view"
      [ngStyle]="{ display: (mobileMapService.isMobileMapVisible$ | async) ? 'block' : 'none' }">
    </nat-map>

    <app-language-switcher></app-language-switcher>

    <button
      data-cy="auth-menu"
      mat-button
      [matMenuTriggerFor]="menu">
      <mat-icon class="icon-medium">person</mat-icon>
    </button>

    <mat-menu #menu="matMenu">
      <button
        mat-menu-item
        data-cy="login-button"
        (click)="openAuthDialog(false)"
        [disabled]="userService.isLoggedIn$ | async">
        {{ "navigation.login" | translate }}
      </button>
      <button
        mat-menu-item
        (click)="sendEmailVerification()"
        [disabled]="isEmailVerificationDisabled$ | async">
        <span *ngIf="formattedTimeRemaining; else normalText">
          {{ "navigation.emailVerification" | translate }} ({{ formattedTimeRemaining }})
        </span>
        <ng-template #normalText> {{ "navigation.emailVerification" | translate }} </ng-template>
      </button>

      <button
        mat-menu-item
        (click)="logout()"
        [disabled]="userService.isLoggedOut$ | async">
        {{ "navigation.logout" | translate }}
      </button>
    </mat-menu>
  </div>
</nav>
