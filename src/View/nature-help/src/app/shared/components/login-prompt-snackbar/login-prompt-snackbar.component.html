<div class="login-prompt-snackbar">
  <span class="message">{{ data.message }}</span>
  <div class="actions">
    <button
      mat-button
      class="login-action"
      (click)="onLogin()">
      {{ "navigation.login" | translate }}
    </button>
    <button
      mat-button
      class="close-action"
      (click)="onClose()">
      {{ "common.close" | translate }}
    </button>
  </div>
</div>
