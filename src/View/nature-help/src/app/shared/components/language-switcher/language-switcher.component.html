<div class="language-switcher">
  <button
    mat-icon-button
    [matMenuTriggerFor]="languageMenu"
    class="language-button"
    [attr.aria-label]="'Language switcher'">
    <span class="current-flag">{{ getCurrentFlag() }}</span>
    <mat-icon class="dropdown-icon">keyboard_arrow_down</mat-icon>
  </button>

  <mat-menu
    #languageMenu="matMenu"
    class="language-menu">
    <button
      mat-menu-item
      *ngFor="let lang of languages"
      (click)="switchLanguage(lang.code)"
      [class.active]="currentLanguage === lang.code"
      class="language-menu-item">
      <span class="language-menu-label">
        <span class="country-code">{{ lang.countryCode }}</span>
        <span class="language-menu-divider">|</span>
        <span class="language-name">{{ lang.name }}</span>
      </span>
      <mat-icon
        *ngIf="currentLanguage === lang.code"
        class="check-icon"
        >check</mat-icon
      >
    </button>
  </mat-menu>
</div>
