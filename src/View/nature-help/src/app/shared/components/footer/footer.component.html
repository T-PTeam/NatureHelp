<!-- Футер -->
<footer
  class="site-footer"
  role="contentinfo">
  <div class="footer-inner">
    <div class="footer-left">
      <p>
        &copy; <span>{{ currentYear }}</span> {{ "legal.copyright" | translate }}
      </p>
      <p>
        {{ "legal.legalAddress" | translate }}
      </p>
    </div>
    <div class="footer-right">
      <nav aria-label="Footer menu">
        <a
          (click)="navigateToPrivacy()"
          style="cursor: pointer"
          >{{ "footer.privacy" | translate }}</a
        >
        |
        <a
          (click)="navigateToContacts()"
          style="cursor: pointer"
          >{{ "footer.contacts" | translate }}</a
        >
      </nav>
    </div>
  </div>
</footer>
