<h2
  mat-dialog-title
  class="dialog-title">
  {{ "passwordReset.loginTitle" | translate }}
</h2>
<div mat-dialog-content>
  <form [formGroup]="formGroup">
    <mat-form-field class="full-width">
      <mat-label>{{ "forms.email" | translate }}</mat-label>
      <input
        matInput
        type="email"
        formControlName="email" />
      <mat-error *ngIf="formGroup.get('email')?.invalid && formGroup.get('email')?.touched">
        {{ "passwordReset.emailError" | translate }}
      </mat-error>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>{{ "passwordReset.passwordLabel" | translate }}</mat-label>
      <input
        matInput
        [type]="hidePassword ? 'password' : 'text'"
        formControlName="password" />
      <button
        mat-icon-button
        matSuffix
        (click)="hidePassword = !hidePassword"
        type="button">
        <mat-icon>{{ hidePassword ? "visibility_off" : "visibility" }}</mat-icon>
      </button>
      <mat-error *ngIf="formGroup.get('password')?.invalid && formGroup.get('password')?.touched">
        {{ "passwordReset.passwordError" | translate }}
      </mat-error>
    </mat-form-field>

    <div class="forgot-password-link">
      <a
        href="#"
        (click)="onForgotPassword($event)">
        {{ "passwordReset.forgotPassword" | translate }}
      </a>
    </div>
  </form>
</div>

<div
  mat-dialog-actions
  class="action-buttons">
  <button
    class="reset-button"
    mat-raised-button
    (click)="closeDialog()">
    {{ "common.cancel" | translate }}
  </button>
  <button
    class="apply-button"
    mat-flat-button
    color="primary"
    (click)="onSubmit()"
    [disabled]="formGroup.invalid"
    type="submit">
    {{ "passwordReset.loginBtn" | translate }}
  </button>
</div>
