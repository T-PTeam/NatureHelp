<h2
  mat-dialog-title
  class="dialog-title">
  {{ "passwordReset.sendResetLinkTitle" | translate }}
</h2>
<div mat-dialog-content>
  <p class="dialog-description">
    {{ "passwordReset.sendResetLinkDescription" | translate }}
  </p>
  <form [formGroup]="formGroup">
    <mat-form-field class="full-width">
      <mat-label>{{ "forms.email" | translate }}</mat-label>
      <input
        matInput
        type="email"
        formControlName="email" />
      <mat-error *ngIf="formGroup.get('email')?.invalid && formGroup.get('email')?.touched">
        {{ "passwordReset.emailError" | translate }}
      </mat-error>
    </mat-form-field>
  </form>
</div>

<div
  mat-dialog-actions
  class="action-buttons">
  <button
    class="reset-button"
    mat-raised-button
    (click)="closeDialog()">
    {{ "common.cancel" | translate }}
  </button>
  <button
    class="apply-button"
    mat-flat-button
    color="primary"
    (click)="onSubmit()"
    [disabled]="formGroup.invalid"
    type="submit">
    {{ "passwordReset.sendResetLinkBtn" | translate }}
  </button>
</div>
