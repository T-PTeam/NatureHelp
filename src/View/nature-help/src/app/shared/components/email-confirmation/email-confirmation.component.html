<div class="email-confirmation-container">
  <div class="confirmation-card">
    <div
      *ngIf="isLoading"
      class="loading-state">
      <mat-spinner diameter="60"></mat-spinner>
      <h2>{{ "forms.confirmingEmailTitle" | translate }}</h2>
      <p>{{ "forms.confirmingEmailDescription" | translate }}</p>
    </div>

    <div
      *ngIf="!isLoading && isSuccess"
      class="success-state">
      <div class="success-icon">
        <mat-icon>check_circle</mat-icon>
      </div>
      <h2>{{ "forms.emailConfirmedTitle" | translate }}</h2>
      <p>{{ "forms.emailConfirmedDescription" | translate }}</p>
      <div class="action-buttons">
        <button
          mat-raised-button
          color="primary"
          (click)="goToHome()">
          {{ "forms.goToHomeBtn" | translate }}
        </button>
      </div>
    </div>

    <div
      *ngIf="!isLoading && isError"
      class="error-state">
      <div class="error-icon">
        <mat-icon>error</mat-icon>
      </div>
      <h2>{{ "forms.emailConfirmationErrorTitle" | translate }}</h2>
      <p class="error-message">{{ errorMessage }}</p>
      <div class="action-buttons">
        <button
          mat-raised-button
          color="primary"
          (click)="goToHome()">
          {{ "forms.goToHomeBtn" | translate }}
        </button>
        <button
          mat-button
          (click)="resendVerification()">
          {{ "forms.resendVerificationBtn" | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
