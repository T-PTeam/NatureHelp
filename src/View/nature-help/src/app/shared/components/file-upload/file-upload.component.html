<div class="upload-box">
  <mat-form-field
    appearance="fill"
    class="file-input-field">
    <mat-label>Select a file</mat-label>
    <input
      matInput
      [value]="selectedFile?.name"
      readonly />
    <button
      mat-icon-button
      matSuffix
      (click)="fileInput.click()"
      matTooltip="Choose file">
      <mat-icon>attach_file</mat-icon>
    </button>
  </mat-form-field>

  <input
    type="file"
    #fileInput
    hidden
    (change)="onFileSelected($event)" />

  <button
    class="upload-btn"
    mat-raised-button
    color="accent"
    (click)="uploadFile()"
    [disabled]="!selectedFile || isUploading">
    <nat-loading-indicator *ngIf="isUploading" type="button" [diameter]="20"></nat-loading-indicator>
    <mat-icon *ngIf="!isUploading" class="upload-icon">cloud_upload</mat-icon>
    <span *ngIf="!isUploading">Upload</span>
    <span *ngIf="isUploading">Uploading...</span>
  </button>

  <div *ngIf="isUploading" class="upload-progress-wrapper">
    <nat-loading-indicator
      type="progress"
      [progress]="uploadProgress">
    </nat-loading-indicator>
  </div>
</div>
