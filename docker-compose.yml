services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: NatureHelpDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 10101010
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - logging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "5000:5000"
    extra_hosts: 
      - "host.docker.internal:host-gateway"
    volumes:
      - dataprotection-keys:/app/DataProtection-Keys
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      
      ConnectionStrings__DefaultConnection: "Host=${DO_DB_HOST};Port=25060;Database=defaultdb;Username=doadmin;Password=${DO_DB_PASSWORD};SSL Mode=Require;Trust Server Certificate=true"
      
      ConnectionStrings__LocalConnection: "Host=postgres;Port=5432;Database=NatureHelpDB;Username=postgres;Password=10101010;Trust Server Certificate=true;Timeout=30;Command Timeout=30"

      Serilog__WriteTo__1__Args__serverUrl: "http://seq"
      Serilog__WriteTo__1__Args__apiKey: "j51PsN894Y5YVhWWNb9n"
      Serilog__WriteTo__2__Args__nodeUris: "http://elasticsearch:9200"
      Serilog__WriteTo__3__Args__uri: "http://loki:3100"

      OAuth2__Google__ClientId: "${GOOGLE_CLIENT_ID}"
      OAuth2__Google__ClientSecret: "${GOOGLE_CLIENT_SECRET}"
      OAuth2__Facebook__AppId: "${FACEBOOK_APP_ID}"
      OAuth2__Facebook__AppSecret: "${FACEBOOK_APP_SECRET}"

    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - logging-network

  frontend:
    build:
      context: ./src/View/nature-help
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5051:80"
    depends_on:
      - backend
    volumes:
       - ./src/View/nature-help/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - logging-network
      
  seq:
    image: datalust/seq:latest
    container_name: seq
    ports:
      - "5341:80"     
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    # volumes:
      # - seq-data:/data
    networks:
      - logging-network
      
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - logging-network
      
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - logging-network
      
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - logging-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=
      - ELASTICSEARCH_PASSWORD=
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - logging-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - logging-network

volumes:
  postgres-data:
  seq-data:
  loki-data:
  grafana-data:
  elasticsearch-data:
  prometheus-data:
  dataprotection-keys:

networks:
  logging-network:
    driver: bridge